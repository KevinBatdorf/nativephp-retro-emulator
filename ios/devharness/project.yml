# Device harness — a minimal host app whose UI-test bundle drives the INSTALLED
# demo on a physical iPhone (a phone has no CLI screencap). Physical-device
# XCTest needs a host app: "Tool-hosted testing is unavailable on device
# destinations". Regenerate the project with `xcodegen` (the .xcodeproj is
# gitignored), then:
#   xcodebuild test -project DevHarness.xcodeproj -scheme DemoUI \
#     -destination 'platform=iOS,id=<udid>'
name: DevHarness
options:
  bundleIdPrefix: com.kevinbatdorf.retroemulator
settings:
  base:
    # Same team as the demo's NATIVEPHP_DEVELOPMENT_TEAM. Automatic signing
    # reuses the cached Xcode-managed wildcard profile ("iOS Team Provisioning
    # Profile: *", covers any app id on this team + this iPhone) — do NOT pass
    # -allowProvisioningUpdates; the CLI has no Apple ID session to refresh with.
    DEVELOPMENT_TEAM: PZU8VB9ACR
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  DevHarness:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinbatdorf.retroemulator.devharness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DemoUITests:
    # Drives the INSTALLED demo app (com.kevin.oceanwaveshine) on the phone —
    # rotation + screenshot capture, since a physical iPhone has no CLI
    # screencap. Screenshots land as xcresult attachments.
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DevHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinbatdorf.retroemulator.demouitests
schemes:
  DemoUI:
    build:
      targets:
        DevHarness: all
        DemoUITests: [test]
    test:
      targets: [DemoUITests]
