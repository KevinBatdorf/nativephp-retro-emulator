# Builds the native release assets from a bare checkout and cuts the GitHub
# release — no developer machine in the path. Trigger from the Actions tab;
# the version comes from nativephp.json.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Versions are immutable — a fix ships as the next number."
        type: string
        required: true

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse to re-release an existing version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION#v}"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$INPUT_VERSION' is not a X.Y.Z version." >&2
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$V" | grep -q .; then
            echo "::error::v$V is already released — versions are immutable, ship the next number." >&2
            exit 1
          fi
          echo "releasing v$V"

  android:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # build.gradle.kts pins this NDK; the librashader script's fallback
      # would grab the newest installed one instead.
      - name: Install pinned NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null

      - name: librashader (Vulkan, both ABIs)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          ./scripts/build_librashader_android.sh

      - name: Android native libraries
        run: ./scripts/build_android_libs.sh

      - uses: actions/upload-artifact@v7
        with:
          name: jniLibs
          path: resources/android/jniLibs
          if-no-files-found: error

  ios:
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: librashader (Metal, device + simulator)
        run: ./scripts/build_librashader_ios.sh

      - name: RetroEmulator.xcframework
        run: ./scripts/build_xcframework.sh

      - uses: actions/upload-artifact@v7
        with:
          name: xcframework
          path: build/RetroEmulator.xcframework
          if-no-files-found: error

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: jniLibs
          path: resources/android/jniLibs

      - uses: actions/download-artifact@v8
        with:
          name: xcframework
          path: build/RetroEmulator.xcframework

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="${INPUT_VERSION#v}"
          php -r '
          $m = json_decode(file_get_contents("nativephp.json"), true);
          $m["version"] = $argv[1];
          file_put_contents("nativephp.json", json_encode($m, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES)."\n");
          ' "$V"
          sed -i "s/^  s.version      = '.*'/  s.version      = '$V'/" RetroEmulator.podspec

      - name: Package assets and pin checksums
        run: ./scripts/package_release_assets.sh

      - name: Commit manifest, tag, publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(php -r 'echo json_decode(file_get_contents("nativephp.json"))->version;')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add resources/native-assets.json nativephp.json RetroEmulator.podspec
          git diff --cached --quiet || git commit -m "Release $VERSION: version + CI-built asset checksums"

          # Main can move during the ~20-min build; a rejected branch push must not orphan the tag.
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git tag "$VERSION"
          git push --atomic origin "HEAD:${{ github.ref_name }}" "$VERSION"

          gh release create "$VERSION" build/release-assets/*.zip \
            --title "$VERSION" \
            --notes "See CHANGELOG.md. The attached zips are the CI-built native cores; the plugin's copy-assets hook downloads them (sha256-pinned by resources/native-assets.json) on a consumer's first build per platform."
